<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ManageMed</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-container">
        <div class="gradient-orb orb1"></div>
        <div class="gradient-orb orb2"></div>
        <div class="gradient-orb orb3"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">ManageMed</h1>
                <div class="form-toggle">
                    <button class="toggle-btn active" data-form="login">Login</button>
                    <button class="toggle-btn" data-form="signup">Sign Up</button>
                </div>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" class="form-input" placeholder="Enter your email" required>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                            <span class="eye-icon">👁️</span>
                        </button>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Sign In</span>
                    <div class="btn-glow"></div>
                </button>
            </form>

            <!-- Signup Form -->
            <form class="auth-form hidden" id="signupForm">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-input" placeholder="Enter your name" required>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" class="form-input" placeholder="Enter your email" required>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" placeholder="Create password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                            <span class="eye-icon">👁️</span>
                        </button>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" placeholder="Confirm password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                            <span class="eye-icon">👁️</span>
                        </button>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Create Account</span>
                    <div class="btn-glow"></div>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
