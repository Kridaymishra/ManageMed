<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ManageMed</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-container">
        <div class="gradient-orb orb1"></div>
        <div class="gradient-orb orb2"></div>
        <div class="gradient-orb orb3"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">ManageMed</h1>
                <div class="form-toggle">
                    <button class="toggle-btn active" data-form="login">Login</button>
                    <button class="toggle-btn" data-form="signup">Sign Up</button>
                </div>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" class="form-input" placeholder="Enter your email" required>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                            <span class="eye-icon">👁️</span>
                        </button>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Sign In</span>
                    <div class="btn-glow"></div>
                </button>
            </form>

            <!-- Signup Form -->
            <form class="auth-form hidden" id="signupForm">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <div class="input-wrapper">
                        <input type="text" class="form-input" placeholder="Enter your name" required>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <input type="email" class="form-input" placeholder="Enter your email" required>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" placeholder="Create password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                            <span class="eye-icon">👁️</span>
                        </button>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" class="form-input" placeholder="Confirm password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                            <span class="eye-icon">👁️</span>
                        </button>
                        <div class="input-glow"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Create Account</span>
                    <div class="btn-glow"></div>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
    const supabaseUrl = 'https://YOUR_PROJECT_URL.supabase.co'; 
    const supabaseKey = 'YOUR_LONG_ANON_KEY_HERE';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // Login Logic
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = e.target.querySelector('input[type="email"]').value;
        const password = e.target.querySelector('input[type="password"]').value;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) alert("Error: " + error.message);
        else window.location.href = 'dashboard.html';
    });

    // Signup Logic
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const inputs = e.target.querySelectorAll('input');
        const name = inputs[0].value; // First input is Name
        const email = inputs[1].value;
        const password = inputs[2].value;

        // 1. Sign up user
        const { data, error } = await supabase.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            alert("Error: " + error.message);
        } else {
            // 2. Create Profile
            await supabase.from('profiles').insert([{ 
                id: data.user.id, 
                owner_name: name 
            }]);
            alert("Account created! Log in now.");
        }
    });
</script>
</body>
</html>
